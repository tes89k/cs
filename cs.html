<!DOCTYPE html>
<html lang="ru">
<head>

<style>
    body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
    #hud { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; color: #fff; text-shadow: 2px 2px 3px #000; pointer-events: none; z-index: 100; font-size: 20px; font-weight: bold; }
    .hud-box { background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; pointer-events: none; z-index: 100; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0f0; box-shadow: 0 0 3px #000, 0 0 3px #000; }
    #crosshair::before { top: 10px; left: 0; width: 22px; height: 2px; }
    #crosshair::after { top: 0; left: 10px; width: 2px; height: 22px; }
    #click { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.88); color: #fff; font-size: 30px; cursor: pointer; z-index: 200; flex-direction: column; text-align: center; padding: 20px; }
    #click p { font-size: 14px; color: #aaa; margin-top: 14px; max-width: 600px; line-height: 1.6; }
    #info { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 4px; font-size: 13px; pointer-events: none; z-index: 100; border-left: 3px solid #e6b800; }
    #hurt { position: absolute; inset: 0; pointer-events: none; z-index: 50; background: radial-gradient(circle at center, transparent 50%, rgba(180,0,0,0.7) 100%); opacity: 0; transition: opacity 0.25s; }
    #killfeed { position: absolute; top: 15px; right: 15px; color: #fff; text-align: right; z-index: 100; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    .kf { background: rgba(180,20,20,0.75); padding: 4px 10px; margin-bottom: 4px; border-radius: 3px; display: inline-block; }
</style>

<body>
<div id="info">de_dust2 • WASD • ЛКМ стрелять • R перезарядка • 1-4 оружие • Space прыжок</div>
<div id="crosshair"></div>
<div id="hurt"></div>
<div id="killfeed"></div>
<div id="hud">
    <div class="hud-box">HP: <span id="health" style="color:#4caf50">100</span></div>
    <div class="hud-box"><span id="weapon" style="color:#ffb300">AK-47</span> | <span id="ammo">30/90</span></div>
</div>
<div id="click">
    <div>КЛИКНИ ЧТОБЫ ИГРАТЬ</div>
    <p>WASD — движение • Мышь — обзор • ЛКМ — стрельба • R — перезарядка • 1-4 — оружие • Space — прыжок</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const EYE_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.4;
const GRAVITY = -25;
const MOVE_SPEED = 7;
const JUMP_FORCE = 7;

const WEAPONS = {
    ak47:  { name: 'AK-47', damage: 36, fireRate: 100, mag: 30, reserve: 90, reload: 2.4, spread: 0.02, auto: true },
    m4a4:  { name: 'M4A4',  damage: 33, fireRate: 90,  mag: 30, reserve: 90, reload: 3.1, spread: 0.016, auto: true },
    awp:   { name: 'AWP',   damage: 115,fireRate: 1200,mag: 5,  reserve: 30, reload: 3.7, spread: 0.001, auto: false },
    glock: { name: 'Glock', damage: 28, fireRate: 150, mag: 20, reserve: 120,reload: 2.2, spread: 0.03, auto: false }
};

let scene, camera, renderer, controls;
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();
const velocity = new THREE.Vector3();
const colliders = [];
const bots = [];
let weaponModel = null;
let weaponBasePos = new THREE.Vector3(0.28, -0.22, -0.55);
let weaponBobT = 0;
let isLocked = false;
let autoFireTimer = null;
let recoil = 0;

const player = {
    health: 100,
    weapon: 'ak47',
    ammo: { ak47: 30, m4a4: 30, awp: 5, glock: 20 },
    reserve: { ak47: 90, m4a4: 90, awp: 30, glock: 120 },
    reloading: false,
    lastShot: 0
};

const keys = { w: false, a: false, s: false, d: false };
let canJump = true;

// ==== Procedural textures ====
function makeSand() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#c9b88a'; x.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 40000; i++) {
        const v = Math.random() * 70 - 35;
        x.fillStyle = `rgba(${190+v},${170+v},${120+v},0.45)`;
        x.fillRect(Math.random()*512, Math.random()*512, 2, 2);
    }
    for (let i = 0; i < 120; i++) {
        x.fillStyle = `rgba(${100+Math.random()*70},${80+Math.random()*60},${50+Math.random()*40},0.35)`;
        x.beginPath();
        x.arc(Math.random()*512, Math.random()*512, Math.random()*10+2, 0, Math.PI*2);
        x.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(10, 10);
    t.anisotropy = 4;
    return t;
}

function makeWall() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#b8a67e'; x.fillRect(0, 0, 512, 512);
    // brick pattern
    const bh = 64, bw = 128;
    x.strokeStyle = 'rgba(90,70,50,0.5)';
    x.lineWidth = 3;
    for (let y = 0; y <= 512; y += bh) {
        x.beginPath(); x.moveTo(0, y); x.lineTo(512, y); x.stroke();
    }
    for (let r = 0; r < 512/bh; r++) {
        const off = (r % 2) * (bw/2);
        for (let xx = off; xx <= 512; xx += bw) {
            x.beginPath(); x.moveTo(xx, r*bh); x.lineTo(xx, (r+1)*bh); x.stroke();
        }
    }
    for (let i = 0; i < 20000; i++) {
        const v = Math.random() * 50 - 25;
        x.fillStyle = `rgba(${150+v},${130+v},${100+v},0.35)`;
        x.fillRect(Math.random()*512, Math.random()*512, 3, 3);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 1);
    t.anisotropy = 4;
    return t;
}

// ==== Init ====
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc9b88a);
    scene.fog = new THREE.Fog(0xc9b88a, 55, 170);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 500);
    camera.position.set(0, EYE_HEIGHT, 22);
    camera.rotation.order = 'YXZ';

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    controls = new PointerLockControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const sun = new THREE.DirectionalLight(0xfff0d8, 1.1);
    sun.position.set(50, 90, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 300;
    sun.shadow.camera.left = -90;
    sun.shadow.camera.right = 90;
    sun.shadow.camera.top = 90;
    sun.shadow.camera.bottom = -90;
    scene.add(sun);
    scene.add(sun.target);

    buildMap();
    buildWeapon();
    spawnBots();

    document.getElementById('click').addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => { document.getElementById('click').style.display = 'none'; isLocked = true; });
    controls.addEventListener('unlock', () => { document.getElementById('click').style.display = 'flex'; isLocked = false; });

    addEventListener('keydown', e => {
        if (e.code === 'KeyW') keys.w = true;
        if (e.code === 'KeyA') keys.a = true;
        if (e.code === 'KeyS') keys.s = true;
        if (e.code === 'KeyD') keys.d = true;
        if (e.code === 'Space' && canJump) { velocity.y = JUMP_FORCE; canJump = false; }
        if (e.code === 'KeyR') reload();
        if (e.code === 'Digit1') switchWeapon('ak47');
        if (e.code === 'Digit2') switchWeapon('m4a4');
        if (e.code === 'Digit3') switchWeapon('awp');
        if (e.code === 'Digit4') switchWeapon('glock');
    });
    addEventListener('keyup', e => {
        if (e.code === 'KeyW') keys.w = false;
        if (e.code === 'KeyA') keys.a = false;
        if (e.code === 'KeyS') keys.s = false;
        if (e.code === 'KeyD') keys.d = false;
    });
    addEventListener('mousedown', e => {
        if (!isLocked || e.button !== 0) return;
        shoot();
        if (WEAPONS[player.weapon].auto) {
            autoFireTimer = setInterval(shoot, WEAPONS[player.weapon].fireRate);
        }
    });
    addEventListener('mouseup', () => {
        if (autoFireTimer) { clearInterval(autoFireTimer); autoFireTimer = null; }
    });
    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    switchWeapon('ak47');
    animate();
}

// ==== Map ====
function buildMap() {
    const sandTex = makeSand();
    const wallTex = makeWall();
    const floorMat = new THREE.MeshStandardMaterial({ map: sandTex, roughness: 1 });
    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.8 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.5 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x5b3a1a, roughness: 0.8 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    function wall(x1, z1, x2, z2, h = 4, mat = wallMat) {
        const dx = x2-x1, dz = z2-z1;
        const len = Math.hypot(dx, dz);
        if (len < 0.05) return;
        const g = new THREE.BoxGeometry(len, h, 0.5);
        const m = new THREE.Mesh(g, mat);
        m.position.set((x1+x2)/2, h/2, (z1+z2)/2);
        m.rotation.y = -Math.atan2(dz, dx);
        m.castShadow = true; m.receiveShadow = true;
        scene.add(m);
        colliders.push(new THREE.Box3().setFromObject(m));
    }

    function box(x, z, s, h = null, mat = boxMat) {
        const hh = h ?? s;
        const m = new THREE.Mesh(new THREE.BoxGeometry(s, hh, s), mat);
        m.position.set(x, hh/2, z);
        m.castShadow = true; m.receiveShadow = true;
        scene.add(m);
        colliders.push(new THREE.Box3().setFromObject(m));
    }

    // ---- Outer boundary ----
    wall(-40, 28, 40, 28);
    wall(-40, -38, 40, -38);
    wall(-40, 28, -40, -38);
    wall(40, 28, 40, -38);

    // ---- Long A ----
    wall(-32, 22, -32, -20);
    wall(-22, 22, -22, -20);
    box(-27, 8, 1.5);
    box(-28, -2, 2);
    box(-26, -14, 1.5);

    // ---- A site ----
    wall(-22, -20, -22, -16);
    // gap from -16 to -10 (catwalk access)
    wall(-22, -10, -22, -24);
    // gap from -24 to -30 (CT access)
    wall(-22, -30, -22, -38);
    box(-27, -28, 2, 1.5);
    box(-33, -33, 2.2, 2.2);
    box(-24, -31, 1.6, 1.6);

    // ---- Mid ----
    wall(-4, 22, -4, -10);
    wall(4, 22, 4, -10);
    // Double doors (south end of Mid)
    wall(-4, 12, -1, 12, 4, doorMat);
    wall(1, 12, 4, 12, 4, doorMat);
    // Mid doors (north end)
    wall(-4, -6, -1, -6, 4, doorMat);
    wall(1, -6, 4, -6, 4, doorMat);
    box(0, 0, 1.5, 1.5); // Xbox

    // ---- Catwalk ----
    wall(-4, -10, -22, -10);
    wall(-4, -16, -22, -16);

    // ---- Upper tunnels ----
    wall(4, -14, 22, -14);
    wall(4, -8, 22, -8);

    // ---- B tunnels ----
    wall(22, 22, 22, -8);
    // gap -8 to -14 (upper tunnels)
    wall(22, -14, 22, -20);
    wall(32, 22, 32, -20);
    box(27, 6, 1.5);
    box(25, -4, 1.5);

    // ---- B site ----
    wall(22, -20, 22, -24);
    // gap -24 to -30 (CT access)
    wall(22, -30, 22, -38);
    box(29, -28, 2, 1.5);
    box(34, -33, 2.2, 2.2);
    box(26, -31, 2.5, 1.5, metalMat);

    // ---- CT spawn ----
    wall(-10, -25, -10, -38);
    wall(10, -25, 10, -38);
    box(-5, -33, 1.2, 1.2);
    box(5, -33, 1.2, 1.2);
}

// ==== Weapon model (AK-47-ish) ====
function buildWeapon() {
    if (weaponModel) {
        camera.remove(weaponModel);
        weaponModel.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    }
    weaponModel = new THREE.Group();

    const metal = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.7, roughness: 0.35 });
    const wood  = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.75 });
    const woodDark = new THREE.MeshStandardMaterial({ color: 0x4a2e15, roughness: 0.8 });

    function add(geo, mat, x, y, z, rx=0, ry=0, rz=0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        weaponModel.add(m);
        return m;
    }

    // Barrel
    add(new THREE.CylinderGeometry(0.022, 0.022, 0.75, 10), metal, 0, 0.03, -0.55, -Math.PI/2);
    // Muzzle brake
    add(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 10), metal, 0, 0.03, -0.95, -Math.PI/2);
    // Gas tube
    add(new THREE.CylinderGeometry(0.016, 0.016, 0.5, 8), metal, 0, 0.09, -0.5, -Math.PI/2);
    // Upper handguard (wood)
    add(new THREE.BoxGeometry(0.07, 0.05, 0.28), wood, 0, 0.09, -0.35);
    // Lower handguard (wood)
    add(new THREE.BoxGeometry(0.08, 0.08, 0.32), wood, 0, 0.02, -0.4);
    // Receiver
    add(new THREE.BoxGeometry(0.075, 0.11, 0.32), metal, 0, 0.02, -0.05);
    // Rear sight block
    add(new THREE.BoxGeometry(0.05, 0.04, 0.05), metal, 0, 0.1, -0.15);
    // Front sight
    add(new THREE.BoxGeometry(0.02, 0.09, 0.03), metal, 0, 0.13, -0.55);
    // Stock (wood)
    add(new THREE.BoxGeometry(0.07, 0.11, 0.34), woodDark, 0, -0.01, 0.24);
    // Pistol grip (dark)
    add(new THREE.BoxGeometry(0.05, 0.17, 0.09), woodDark, 0, -0.11, 0.1, -0.35);
    // Magazine (curved, approximated)
    add(new THREE.BoxGeometry(0.055, 0.22, 0.1), metal, 0, -0.14, -0.05, 0.25);
    // Trigger guard
    add(new THREE.BoxGeometry(0.03, 0.04, 0.08), metal, 0, -0.06, 0.03);

    // Muzzle flash sprite placeholder (added per-shot)
    weaponModel.userData.muzzleZ = -0.95;
    weaponModel.userData.muzzleY = 0.03;

    weaponModel.position.copy(weaponBasePos);
    weaponModel.rotation.set(0.02, 0.06, 0.01);

    weaponModel.traverse(o => { o.userData.isWeapon = true; });

    camera.add(weaponModel);
    scene.add(camera);
}

function switchWeapon(k) {
    if (!WEAPONS[k]) return;
    player.weapon = k;
    document.getElementById('weapon').textContent = WEAPONS[k].name;
    updateAmmo();
}

function updateAmmo() {
    const w = player.weapon;
    document.getElementById('ammo').textContent = `${player.ammo[w]}/${player.reserve[w]}`;
}

// ==== Shooting ====
function shoot() {
    if (player.reloading) return;
    const w = WEAPONS[player.weapon];
    const now = performance.now();
    if (now - player.lastShot < w.fireRate) return;
    if (player.ammo[player.weapon] <= 0) { reload(); return; }

    player.lastShot = now;
    player.ammo[player.weapon]--;
    updateAmmo();
    recoil = Math.min(recoil + 0.03, 0.15);

    // raycast from camera
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    const dir = raycaster.ray.direction.clone();
    dir.x += (Math.random()-0.5) * w.spread;
    dir.y += (Math.random()-0.5) * w.spread;
    dir.normalize();
    raycaster.ray.direction.copy(dir);

    const hits = raycaster.intersectObjects(scene.children, true);
    for (const h of hits) {
        if (h.object.userData.isWeapon) continue; // skip own gun
        if (h.object.userData.isBot) {
            const bot = h.object.userData.botRef;
            if (bot && bot.userData.alive) {
                const headshot = h.point.y > bot.position.y + 1.2;
                const dmg = w.damage * (headshot ? 4 : 1);
                bot.userData.health -= dmg;
                if (bot.userData.health <= 0) killBot(bot);
            }
            break;
        }
        break; // hit wall
    }

    muzzleFlash();
}

function muzzleFlash() {
    const g = new THREE.SphereGeometry(0.06, 6, 6);
    const m = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.9 });
    const f = new THREE.Mesh(g, m);
    f.position.set(0, 0.03, -0.98);
    f.userData.isWeapon = true;
    weaponModel.add(f);
    setTimeout(() => { if (f.parent) f.parent.remove(f); }, 45);
}

// ==== Reload ====
function reload() {
    const w = WEAPONS[player.weapon];
    if (player.reloading || player.ammo[player.weapon] >= w.mag || player.reserve[player.weapon] <= 0) return;
    player.reloading = true;
    document.getElementById('ammo').style.color = '#ff3030';
    setTimeout(() => {
        const need = w.mag - player.ammo[player.weapon];
        const take = Math.min(need, player.reserve[player.weapon]);
        player.ammo[player.weapon] += take;
        player.reserve[player.weapon] -= take;
        player.reloading = false;
        document.getElementById('ammo').style.color = '#fff';
        updateAmmo();
    }, w.reload * 1000);
}

// ==== Bots ====
function spawnBots() {
    const positions = [
        { x: -27, z: -28 }, { x: 28, z: -28 },
        { x: 0, z: -20 }, { x: -15, z: -20 }, { x: 15, z: -20 }
    ];
    positions.forEach(p => {
        const b = createBot();
        b.position.set(p.x, 0, p.z);
        scene.add(b);
        bots.push(b);
    });
}

function createBot() {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a5f8a, roughness: 0.8 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0xd4a878, roughness: 0.7 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.3, 10), bodyMat);
    body.position.y = 0.65;
    body.castShadow = true;
    body.userData.isBot = true;
    body.userData.botRef = g;
    g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), headMat);
    head.position.y = 1.5;
    head.castShadow = true;
    head.userData.isBot = true;
    head.userData.botRef = g;
    g.add(head);

    g.userData = {
        alive: true,
        health: 100,
        lastShot: 0,
        target: new THREE.Vector3()
    };
    return g;
}

function killBot(bot) {
    bot.userData.alive = false;
    bot.visible = false;
    addKillFeed('Вы убили бота');
    setTimeout(() => {
        const pos = [
            {x: -27, z: -28}, {x: 28, z: -28}, {x: 0, z: -20},
            {x: -15, z: -20}, {x: 15, z: -20}
        ][Math.floor(Math.random()*5)];
        bot.position.set(pos.x, 0, pos.z);
        bot.userData.health = 100;
        bot.userData.alive = true;
        bot.visible = true;
    }, 4000);
}

function addKillFeed(text) {
    const kf = document.getElementById('killfeed');
    const d = document.createElement('div');
    d.className = 'kf';
    d.textContent = text;
    kf.appendChild(d);
    setTimeout(() => d.remove(), 3000);
}

// ==== Player update ====
function updatePlayer(dt) {
    if (!controls.isLocked) return;

    // Gravity
    velocity.y += GRAVITY * dt;

    // Horizontal input
    const fwd = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
    const str = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);

    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0; right.normalize();

    const move = new THREE.Vector3();
    move.addScaledVector(forward, fwd * MOVE_SPEED * dt);
    move.addScaledVector(right, str * MOVE_SPEED * dt);

    // X axis, then Z axis (sliding)
    const oldX = camera.position.x;
    camera.position.x += move.x;
    if (collides()) camera.position.x = oldX;

    const oldZ = camera.position.z;
    camera.position.z += move.z;
    if (collides()) camera.position.z = oldZ;

    // Vertical
    camera.position.y += velocity.y * dt;
    if (camera.position.y < EYE_HEIGHT) {
        camera.position.y = EYE_HEIGHT;
        velocity.y = 0;
        canJump = true;
    }
    if (collides()) {
        // Hit something above? undo
        camera.position.y -= velocity.y * dt;
        velocity.y = 0;
    }

    // Weapon bob
    const moving = (fwd !== 0 || str !== 0);
    if (moving) {
        weaponBobT += dt * 11;
    } else {
        weaponBobT += dt * 2;
    }
    const bobX = moving ? Math.sin(weaponBobT) * 0.012 : Math.sin(weaponBobT) * 0.003;
    const bobY = moving ? Math.abs(Math.cos(weaponBobT)) * 0.012 : 0;
    recoil *= 0.88;
    weaponModel.position.set(
        weaponBasePos.x + bobX,
        weaponBasePos.y + bobY,
        weaponBasePos.z + recoil
    );
    weaponModel.rotation.x = 0.02 + recoil * 0.6;
}

function collides() {
    const pbox = new THREE.Box3(
        new THREE.Vector3(camera.position.x - PLAYER_RADIUS, camera.position.y - EYE_HEIGHT + 0.1, camera.position.z - PLAYER_RADIUS),
        new THREE.Vector3(camera.position.x + PLAYER_RADIUS, camera.position.y + 0.1, camera.position.z + PLAYER_RADIUS)
    );
    for (const c of colliders) if (pbox.intersectsBox(c)) return true;
    return false;
}

// ==== Bot update ====
function updateBots(dt) {
    for (const b of bots) {
        if (!b.userData.alive) continue;
        const d = b.position.distanceTo(camera.position);
        if (d < 25 && d > 1.5) {
            const dir = new THREE.Vector3().subVectors(camera.position, b.position);
            dir.y = 0; dir.normalize();
            b.position.addScaledVector(dir, 1.6 * dt);
            b.lookAt(camera.position.x, b.position.y, camera.position.z);

            const now = performance.now();
            if (now - b.userData.lastShot > 1200) {
                b.userData.lastShot = now;
                if (Math.random() < 0.25) {
                    player.health -= 8;
                    document.getElementById('health').textContent = Math.max(0, player.health);
                    const h = document.getElementById('hurt');
                    h.style.opacity = 0.7;
                    setTimeout(() => h.style.opacity = 0, 150);
                    if (player.health <= 0) playerDie();
                }
            }
        }
    }
}

function playerDie() {
    addKillFeed('Вы погибли');
    setTimeout(() => {
        player.health = 100;
        document.getElementById('health').textContent = 100;
        camera.position.set(0, EYE_HEIGHT, 22);
        velocity.set(0, 0, 0);
    }, 1500);
}

// ==== Main loop ====
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    updatePlayer(dt);
    updateBots(dt);
    renderer.render(scene, camera);
}

init();
</script>
